apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-local
  namespace: argocd

spec:
  project: default

  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision:  "89.2.0"
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/helm/monitoring/values-local.yaml

    - repoURL: https://github.com/CareerMatch785/careermatch-infrastructure.git
      targetRevision: master
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true