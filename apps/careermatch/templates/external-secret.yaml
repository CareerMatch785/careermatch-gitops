{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: careermatch-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: careermatch-db-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:954976288182:secret:rds!db-49717e06-e255-40d7-b1c6-4056221ecc11-snMl6B
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:954976288182:secret:rds!db-49717e06-e255-40d7-b1c6-4056221ecc11-snMl6B
        property: password
{{- end }}