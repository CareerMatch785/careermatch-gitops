{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: careermatch-frontend
  annotations:
    alb.ingress.kubernetes.io/group.name: careermatch-public
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/success-codes: "200-399"

spec:
  ingressClassName: alb

  rules:
    - http:
        paths:

          - path: /api/v1/job-sources
            pathType: Prefix
            backend:
              service:
                name: job-source-service
                port:
                  number: 8084

          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: {{ .Values.frontend.port }}

{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: careermatch-jobs
  annotations:
    alb.ingress.kubernetes.io/group.name: careermatch-public
    alb.ingress.kubernetes.io/group.order: "-10"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /api/v1/jobs
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api/v1/jobs
            pathType: Exact
            backend:
              service:
                name: job-service
                port:
                  number: 8082
          - path: /api/v1/jobs/exists
            pathType: Exact
            backend:
              service:
                name: job-service
                port:
                  number: 8082
{{- end }}


