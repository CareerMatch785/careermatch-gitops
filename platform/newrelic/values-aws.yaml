global:
  cluster: careermatch
  customSecretName: newrelic-license
  customSecretLicenseKey: licenseKey
  lowDataMode: true

newrelic-infrastructure:
  enabled: true

kube-state-metrics:
  enabled: true

nri-metadata-injection:
  enabled: false

nri-kube-events:
  enabled: true

# Enable logs separately after reviewing ingestion volume.
newrelic-logging:
  enabled: false
