name: Deploy Argo CD to EKS

on:
  push:
    branches: ["main"]
    paths:
      - "argocd/**"
      - "apps/**"
      - "platform/**"
      - ".github/workflows/deploy-argocd.yml"

  pull_request:
    branches: ["main"]
    paths:
      - "argocd/**"
      - "apps/**"
      - "platform/**"
      - ".github/workflows/deploy-argocd.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:

  # =========================================================
  # VALIDATE
  # =========================================================
  validate:
    name: Validate Helm manifests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      # -------------------------------------------------------
      # Lint local configuration
      # -------------------------------------------------------
    #   - name: Lint CareerMatch chart - local
    #     run: |
    #       helm lint apps/careermatch \
    #         --values apps/careermatch/values-local.yaml

      # -------------------------------------------------------
      # Lint AWS configuration
      # -------------------------------------------------------
    #   - name: Lint CareerMatch chart - AWS
    #     run: |
    #       helm lint apps/careermatch \
    #         --values apps/careermatch/values-aws.yaml

      # -------------------------------------------------------
      # Render manifests
      # -------------------------------------------------------
    #   - name: Render CareerMatch chart - AWS
    #     run: |
    #       helm template careermatch apps/careermatch \
    #         --values apps/careermatch/values-aws.yaml \
    #         > /tmp/careermatch-rendered.yaml


  # =========================================================
  # DEPLOY / BOOTSTRAP
  # =========================================================
  deploy:
    name: Bootstrap Argo CD on EKS



    runs-on: ubuntu-latest

    needs: validate

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      # =======================================================
      # AWS AUTHENTICATION
      # =======================================================
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-session-name: argocd-bootstrap-session
          role-to-assume: arn:aws:iam::954976288182:role/ROLE_GITHUBACTIONS_EKS
          aws-region: us-east-1



      - name: Check AWS identity
        run: |
          aws sts get-caller-identity


      # =======================================================
      # CONNECT TO EKS
      # =======================================================
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name CARRERMATCH-EKS-CLUSTER

          kubectl cluster-info
          kubectl get nodes

      - name: Ensure AWS Load Balancer Controller ServiceAccount
        run: |
          if ! kubectl get serviceaccount aws-load-balancer-controller \
            -n kube-system >/dev/null 2>&1; then
            kubectl create serviceaccount aws-load-balancer-controller \
              -n kube-system
          fi

          kubectl get serviceaccount aws-load-balancer-controller \
            -n kube-system \
            -o yaml

      - name: Install AWS Load Balancer Controller
        run: |
            helm repo add eks https://aws.github.io/eks-charts
            helm repo update eks

            helm upgrade --install aws-load-balancer-controller \
            eks/aws-load-balancer-controller \
            -n kube-system \
            --set clusterName=CARRERMATCH-EKS-CLUSTER \
            --set region=us-east-1 \
            --set vpcId=vpc-03e0ca2e2bfd85c55 \
            --set serviceAccount.create=false \
            --set serviceAccount.name=aws-load-balancer-controller \
            --version 1.14.0

      - name: Verify AWS Load Balancer Controller ServiceAccount
        run: |
          kubectl get serviceaccount \
            aws-load-balancer-controller \
            -n kube-system \
            -o yaml

      - name: Wait for AWS Load Balancer Controller
        run: |
            kubectl rollout status \
            deployment/aws-load-balancer-controller \
            -n kube-system \
            --timeout=900s

      # =======================================================
      # VERIFY AWS LOAD BALANCER CONTROLLER
      # =======================================================
      - name: Verify AWS Load Balancer Controller
        run: |
          kubectl get deployment \
            aws-load-balancer-controller \
            -n kube-system


      # =======================================================
      # HELM
      # =======================================================
      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Debug AWS Load Balancer Controller
        if: failure()
        continue-on-error: true
        run: |
            echo "=== Deployment ==="
            kubectl get deployment aws-load-balancer-controller -n kube-system || true
            kubectl describe deployment aws-load-balancer-controller -n kube-system || true

            echo "=== Pods ==="
            kubectl get pods -n kube-system \
            -l app.kubernetes.io/name=aws-load-balancer-controller \
            -o wide || true

            echo "=== Pod details ==="
            for pod in $(kubectl get pods -n kube-system \
              -l app.kubernetes.io/name=aws-load-balancer-controller \
              -o name); do
              kubectl describe -n kube-system "$pod" || true
              kubectl logs -n kube-system "$pod" --all-containers=true \
                --tail=200 || true
            done

            echo "=== Recent events ==="
            kubectl get events -n kube-system \
              --sort-by=.lastTimestamp | tail -n 50 || true

            echo "=== Service ==="
            kubectl get svc aws-load-balancer-webhook-service \
            -n kube-system || true

            echo "=== Endpoints ==="
            kubectl get endpoints aws-load-balancer-webhook-service \
            -n kube-system || true

            echo "=== ServiceAccount ==="
            kubectl get sa aws-load-balancer-controller \
            -n kube-system \
            -o yaml || true
      # =======================================================
      # INSTALL ARGO CD
      # =======================================================
      - name: Install or upgrade Argo CD
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update

          helm upgrade --install argocd argo/argo-cd \
            --namespace argocd \
            --create-namespace \
            --set 'configs.params.server\.insecure=true' \
            --wait \
            --timeout 5m


      # =======================================================
      # WAIT FOR ARGO CD
      # =======================================================
      - name: Wait for Argo CD server
        run: |
          kubectl rollout status \
            deployment/argocd-server \
            --namespace argocd \
            --timeout=180s


      # =======================================================
      # BOOTSTRAP GITOPS APPLICATIONS
      # =======================================================
      - name: Register Argo CD applications
        run: |
          kubectl apply -f argocd/


      # =======================================================
      # VERIFY APPLICATIONS
      # =======================================================
      - name: Verify Argo CD applications
        run: |
          kubectl get applications \
            --namespace argocd


      # =======================================================
      # VERIFY INGRESS
      # =======================================================
      - name: Wait for Argo CD Ingress
        run: |
          echo "Waiting for AWS Load Balancer Controller to create the ALB..."

          for i in {1..30}; do

            ADDRESS=$(kubectl get ingress argocd \
              -n argocd \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' \
              2>/dev/null || true)

            if [ -n "$ADDRESS" ]; then
              echo "Argo CD ALB created:"
              echo "http://$ADDRESS"
              exit 0
            fi

            echo "Waiting for ALB..."
            sleep 10

          done

          echo "ALB is still provisioning."
          kubectl get ingress -n argocd